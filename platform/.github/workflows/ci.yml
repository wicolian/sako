name: CI

on:
  push:
    branches: [main, develop, dabomb]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint API
        run: cd services/api && npm run lint --if-present

      - name: Type check API
        run: cd services/api && npm run typecheck --if-present

      - name: Lint Client
        run: cd apps/client && npm run lint --if-present

      - name: Type check Client
        run: cd apps/client && npm run typecheck --if-present

      - name: Lint Studio
        run: cd apps/studio && npm run lint --if-present

      - name: Type check Studio
        run: cd apps/studio && npm run typecheck --if-present

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run API tests
        run: cd services/api && npm test
        env:
          NODE_ENV: test

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build API
        run: npm run build:api

      - name: Build Client
        run: npm run build:client
        env:
          VITE_API_BASE_URL: https://api.trysako.com
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Build Studio
        run: npm run build:studio
        env:
          VITE_API_BASE_URL: https://api.trysako.com
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false
          tags: sako-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/client/Dockerfile
          push: false
          tags: sako-client:test
          build-args: |
            VITE_API_BASE_URL=https://api.trysako.com
            VITE_CLERK_PUBLISHABLE_KEY=placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Studio Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/studio/Dockerfile
          push: false
          tags: sako-studio:test
          build-args: |
            VITE_API_BASE_URL=https://api.trysako.com
            VITE_CLERK_PUBLISHABLE_KEY=placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
