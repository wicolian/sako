services:
  # Redis - For BullMQ email queues
  redis:
    image: redis:7-alpine
    container_name: sako-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - sako-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service (NestJS) - Development
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    container_name: sako-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      # Database - use externally managed Postgres (e.g., Neon)
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      
      # Required for auth
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      
      # Required for payments
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      
      # CORS - include all local dev ports
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:3002}
      
      # Optional - AI features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      
      # Optional - Slack integration
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_OAUTH_REDIRECT_URL: ${SLACK_OAUTH_REDIRECT_URL:-}
      
      # Optional - Error tracking
      SENTRY_DSN: ${SENTRY_DSN:-}
      
      # Optional - URLs for redirects/emails
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      
      # Optional - Storage (S3/R2)
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-sako-uploads}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      
      # Studio URL for admin emails
      STUDIO_URL: ${STUDIO_URL:-http://localhost:3000}
      
      # Redis for BullMQ queues
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      
      # Marketing (all disabled by default)
      MARKETING_LEADS_ENABLED: ${MARKETING_LEADS_ENABLED:-false}
      MARKETING_EMAILS_ENABLED: ${MARKETING_EMAILS_ENABLED:-false}
      MARKETING_EMAILS_DRY_RUN: ${MARKETING_EMAILS_DRY_RUN:-true}
      MARKETING_CRON_ENABLED: ${MARKETING_CRON_ENABLED:-false}
      
      # Memory optimization
      DEBUG: ${DEBUG:-}
      # Increase Node.js heap size for TypeScript watch mode
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      # Mount source for development hot-reload
      - ./services/api/src:/app/src
      - ./services/api/prisma:/app/prisma
      # Prevent overwriting node_modules
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sako-network
    command: npm run dev

  # Studio App (Admin Dashboard) - Development
  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
      target: development
    container_name: sako-studio
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    environment:
      # Use host URL so browser can reach API when accessing studio via localhost
      VITE_API_BASE_URL: http://localhost:${API_PORT:-3001}/api/v1
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      VITE_COMPOSER_URL: ${VITE_COMPOSER_URL:-http://localhost:3002}
      # Optional - Error tracking & Analytics (disabled in dev by default)
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
      VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
      DOCKER_ENV: "true"
    depends_on:
      - api
    volumes:
      # Mount source for development hot-reload
      - ./apps/studio/src:/app/apps/studio/src
      - ./apps/studio/index.html:/app/apps/studio/index.html
      - ./apps/studio/vite.config.ts:/app/apps/studio/vite.config.ts
      - ./packages:/app/packages
      # Prevent overwriting node_modules
      - /app/node_modules
    networks:
      - sako-network

  # Client App (Customer Portal) - Development
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: development
    container_name: sako-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      # Use host URL so browser can reach API when accessing client via localhost
      VITE_API_BASE_URL: http://localhost:${API_PORT:-3001}/api/v1
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      VITE_COMPOSER_URL: ${VITE_COMPOSER_URL:-http://localhost:3002}
      # Optional - Error tracking & Analytics (disabled in dev by default)
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
      VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
      DOCKER_ENV: "true"
    depends_on:
      - api
    volumes:
      # Mount source for development hot-reload
      - ./apps/client/src:/app/apps/client/src
      - ./apps/client/index.html:/app/apps/client/index.html
      - ./apps/client/vite.config.ts:/app/apps/client/vite.config.ts
      - ./packages:/app/packages
      # Prevent overwriting node_modules
      - /app/node_modules
    networks:
      - sako-network

networks:
  sako-network:
    driver: bridge

volumes:
  redis-data: