<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sako Composer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    
    .title {
      font-size: 16px;
      font-weight: 600;
    }
    
    .subtitle {
      font-size: 12px;
      color: #6b7280;
    }
    
    .content {
      padding: 16px;
    }
    
    .auth-section {
      text-align: center;
      padding: 20px 0;
    }
    
    .auth-section p {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    
    .btn-primary {
      background: #6366f1;
      color: white;
    }
    
    .btn-primary:hover {
      background: #4f46e5;
    }
    
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      width: 100%;
      margin-bottom: 8px;
    }
    
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    
    .user-section {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #6b7280;
    }
    
    .user-info {
      flex: 1;
    }
    
    .user-name {
      font-weight: 500;
      font-size: 14px;
    }
    
    .user-email {
      font-size: 12px;
      color: #6b7280;
    }
    
    .quick-actions {
      margin-top: 8px;
    }
    
    .quick-actions h3 {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .shortcuts {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    
    .shortcuts h3 {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .shortcut {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
    }
    
    .shortcut-key {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .key {
      padding: 2px 6px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
    }
    
    .footer {
      padding: 12px 16px;
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }
    
    .footer a {
      color: #6366f1;
      text-decoration: none;
      font-size: 12px;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    #logged-out, #logged-in {
      display: none;
    }
    
    body.logged-out #logged-out { display: block; }
    body.logged-in #logged-in { display: block; }
    
    /* Brand Section */
    .brand-section, .knowledge-section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .brand-section h3, .knowledge-section h3 {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .select-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 13px;
      background: white;
      cursor: pointer;
    }
    
    .select-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }
    
    .help-text {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
    
    /* Knowledge Search */
    .search-box {
      display: flex;
      gap: 8px;
    }
    
    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .search-input:focus {
      outline: none;
      border-color: #6366f1;
    }
    
    .search-btn {
      padding: 8px 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    
    .search-btn:hover {
      background: #4f46e5;
    }
    
    .knowledge-results {
      margin-top: 8px;
      max-height: 150px;
      overflow-y: auto;
    }
    
    .knowledge-item {
      padding: 8px;
      background: #f9fafb;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    .knowledge-item:hover {
      background: #f3f4f6;
    }
    
    .knowledge-item-title {
      font-size: 13px;
      font-weight: 500;
      color: #111827;
    }
    
    .knowledge-item-snippet {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .knowledge-empty {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body class="logged-out">
  <div class="header">
    <div class="logo">S</div>
    <div>
      <div class="title">Sako Composer</div>
      <div class="subtitle">AI Marketing Assistant</div>
    </div>
  </div>
  
  <div class="content">
    <!-- Logged Out State -->
    <div id="logged-out">
      <div class="auth-section">
        <p>Sign in to use Sako's AI tools anywhere on the web</p>
        <button class="btn btn-primary" id="sign-in-btn">
          Sign in to Sako
        </button>
      </div>
    </div>
    
    <!-- Logged In State -->
    <div id="logged-in">
      <div class="user-section">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="user-name">User</div>
          <div class="user-email" id="user-email">email@example.com</div>
        </div>
      </div>
      
      <!-- Brand Voice Selector -->
      <div class="brand-section">
        <h3>Brand Voice</h3>
        <select id="brand-select" class="select-input">
          <option value="">Loading brands...</option>
        </select>
        <p class="help-text">Content will match your brand's tone</p>
      </div>
      
      <!-- Knowledge Base Search -->
      <div class="knowledge-section">
        <h3>Knowledge Base</h3>
        <div class="search-box">
          <input type="text" id="knowledge-search" class="search-input" placeholder="Search knowledge...">
          <button class="search-btn" id="search-kb-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        </div>
        <div id="knowledge-results" class="knowledge-results"></div>
      </div>
      
      <div class="quick-actions">
        <h3>Quick Actions</h3>
        <button class="btn btn-secondary" id="open-dashboard">
          Open Sako Dashboard
        </button>
        <button class="btn btn-secondary" id="open-studio">
          Open Studio Apps
        </button>
        <button class="btn btn-secondary" id="sign-out-btn">
          Sign Out
        </button>
      </div>
      
      <div class="shortcuts">
        <h3>Keyboard Shortcuts</h3>
        <div class="shortcut">
          <span>Open Sako</span>
          <span class="shortcut-key">
            <span class="key">⌘</span>
            <span class="key">⇧</span>
            <span class="key">S</span>
          </span>
        </div>
        <div class="shortcut">
          <span>Generate Content</span>
          <span class="shortcut-key">
            <span class="key">⌘</span>
            <span class="key">⇧</span>
            <span class="key">G</span>
          </span>
        </div>
        <div class="shortcut">
          <span>Validate Claim</span>
          <span class="shortcut-key">
            <span class="key">⌘</span>
            <span class="key">⇧</span>
            <span class="key">V</span>
          </span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <a href="https://app.sako.ai/help" target="_blank">Help & Support</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
